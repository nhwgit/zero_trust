<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="aDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="aPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 배경 (다크 테마에서도 자체 배경으로 가독성 유지) -->
  <rect x="0" y="0" width="880" height="660" fill="#ffffff"/>

  <!-- Client / Keycloak -->
  <rect x="150" y="24" width="130" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="215" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Client</text>

  <rect x="560" y="24" width="180" height="48" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="650" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Keycloak</text>
  <text x="650" y="62" text-anchor="middle" font-size="12" fill="#64748b">IdP (OIDC) · JWT 발급</text>

  <line x1="284" y1="48" x2="556" y2="48" stroke="#334155" stroke-width="1.8" marker-start="url(#aDark)" marker-end="url(#aDark)"/>
  <text x="420" y="40" text-anchor="middle" font-size="13" fill="#1f2937">① 로그인 → JWT 발급</text>

  <!-- ② 요청 -->
  <line x1="215" y1="76" x2="215" y2="125" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="227" y="105" font-size="13" fill="#1f2937">② 요청 (JWT)</text>

  <!-- 커널 플레인 -->
  <rect x="40" y="130" width="800" height="150" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="56" y="154" font-size="14" font-weight="bold" fill="#9a3412">커널 L3/4 — 시행 지점 ❶ (선택 계층: eBPF/XDP)</text>

  <rect x="70" y="168" width="290" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="215" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">XDP 프로그램 (C)</text>
  <text x="215" y="214" text-anchor="middle" font-size="13" fill="#374151">per-IP SYN 관측</text>
  <text x="215" y="234" text-anchor="middle" font-size="13" fill="#374151">deny map의 IP → 스택 진입 전 DROP</text>

  <rect x="450" y="168" width="240" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="570" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Go 에이전트 (사이드카)</text>
  <text x="570" y="214" text-anchor="middle" font-size="13" fill="#374151">map 폴링 → 임계 초과 판정</text>
  <text x="570" y="234" text-anchor="middle" font-size="13" fill="#374151">차단지시를 deny map에 기록</text>

  <line x1="364" y1="215" x2="446" y2="215" stroke="#334155" stroke-width="1.8" marker-start="url(#aDark)" marker-end="url(#aDark)"/>
  <text x="405" y="203" text-anchor="middle" font-size="11" fill="#64748b">BPF map 공유</text>

  <!-- PASS -->
  <line x1="215" y1="262" x2="215" y2="336" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="227" y="305" font-size="13" fill="#1f2937">PASS</text>

  <!-- 에이전트 ↔ PIP 제어 경로 (판단 요청/지시, 점선) -->
  <path d="M 690 215 L 765 215 L 765 486 L 646 486" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#aPurple)" marker-end="url(#aPurple)"/>
  <text x="752" y="306" text-anchor="end" font-size="12" fill="#7c3aed">rate.l4 신호 ▲ · 차단지시(deny+TTL) ▼ — mTLS</text>

  <!-- L7 플레인 -->
  <rect x="40" y="320" width="800" height="214" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="56" y="344" font-size="14" font-weight="bold" fill="#1e40af">L7 — 시행 지점 ❷</text>

  <rect x="90" y="358" width="250" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="215" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Gateway (DP / PEP)</text>
  <text x="215" y="406" text-anchor="middle" font-size="13" fill="#374151">JWT 검증 + 정책 enforce</text>
  <text x="215" y="426" text-anchor="middle" font-size="13" fill="#374151">결정 캐시 · 레이트 관측</text>
  <text x="215" y="446" text-anchor="middle" font-size="13" fill="#374151">fan-out 구독</text>

  <rect x="470" y="358" width="170" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="555" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">PDP</text>
  <text x="555" y="398" text-anchor="middle" font-size="12" fill="#64748b">정책 결정 (deny-overrides)</text>

  <line x1="344" y1="386" x2="466" y2="386" stroke="#334155" stroke-width="1.8" marker-start="url(#aDark)" marker-end="url(#aDark)"/>
  <text x="405" y="378" text-anchor="middle" font-size="12" fill="#1f2937">③ 판단요청</text>
  <text x="405" y="402" text-anchor="middle" font-size="12" fill="#64748b">허용 / 거부</text>

  <line x1="555" y1="414" x2="555" y2="448" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="567" y="435" font-size="12" fill="#1f2937">④ 속성·위험 조회</text>

  <rect x="470" y="452" width="170" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="555" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">PIP</text>
  <text x="555" y="498" text-anchor="middle" font-size="12" fill="#065f46">위험점수 산출 · epoch 발신</text>

  <!-- ⑤ 통과 -->
  <line x1="215" y1="468" x2="215" y2="562" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="227" y="552" font-size="13" fill="#1f2937">⑤ 허용 시 통과</text>

  <rect x="90" y="566" width="250" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="215" y="588" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">resource-api (보호 대상)</text>
  <text x="215" y="606" text-anchor="middle" font-size="12" fill="#64748b">JWT 재검증 + realm role 인가</text>

  <text x="440" y="646" text-anchor="middle" font-size="12" fill="#64748b">판단은 PDP(정책)·PIP(위험)에만 있다 — XDP·에이전트는 관측·집행·전달만 한다. 커널 계층은 탈부착 가능(없어도 L7 인가는 동작).</text>
</svg>
