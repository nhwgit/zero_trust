<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 570" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="aDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- 배경 (다크 테마에서도 자체 배경으로 가독성 유지) -->
  <rect x="0" y="0" width="810" height="570" fill="#ffffff"/>

  <!-- 공격 트래픽 -->
  <rect x="210" y="20" width="360" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="390" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">토큰 없는 SYN 플러드</text>

  <line x1="390" y1="64" x2="390" y2="108" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="402" y="92" font-size="12" fill="#64748b">게이트웨이 컨테이너 netns eth0, ingress</text>

  <!-- XDP (커널) -->
  <rect x="80" y="112" width="620" height="92" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="390" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">XDP — rate_enforce.c (커널)</text>
  <text x="390" y="160" text-anchor="middle" font-size="13" fill="#374151">① 관측: per-source-IP {pkts, syns} 누적 (LRU HASH)</text>
  <text x="390" y="182" text-anchor="middle" font-size="13" fill="#374151">② 집행: deny map(HASH)에 있고 TTL 안 → XDP_DROP</text>
  <text x="706" y="186" font-size="12" fill="#64748b">← 스택 진입 전</text>

  <!-- XDP ↕ 에이전트 -->
  <line x1="260" y1="204" x2="260" y2="256" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="272" y="236" font-size="12" fill="#1f2937">map 폴링 1s (src_ip_stats)</text>
  <line x1="520" y1="256" x2="520" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="532" y="236" font-size="12" fill="#1f2937">deny map 기록</text>

  <!-- Go 에이전트 -->
  <rect x="80" y="260" width="620" height="104" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Go 에이전트 (사이드카)</text>
  <text x="390" y="308" text-anchor="middle" font-size="13" fill="#374151">윈도우(5s) SYN 차분 → 임계(20) 초과 판정 → PIP에 rate.l4 신호 (mTLS POST)</text>
  <text x="390" y="328" text-anchor="middle" font-size="13" fill="#374151">PIP ack의 enforcement 지시를 deny map에 번역</text>
  <text x="390" y="348" text-anchor="middle" font-size="13" fill="#374151">만료 엔트리 sweep (위생)</text>

  <!-- 에이전트 ↕ PIP -->
  <line x1="260" y1="364" x2="260" y2="416" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="272" y="396" font-size="12" fill="#1f2937">rate.l4 신호</text>
  <line x1="520" y1="416" x2="520" y2="368" stroke="#334155" stroke-width="1.8" marker-end="url(#aDark)"/>
  <text x="532" y="396" font-size="12" fill="#1f2937">ack {reassessed, enforcement:{deny, ttl}}</text>

  <!-- PIP -->
  <rect x="80" y="420" width="620" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="612" y="411" width="64" height="18" rx="9" fill="#10b981"/>
  <text x="644" y="424" text-anchor="middle" font-size="11" fill="#ffffff">판단 주체</text>
  <text x="390" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">PIP</text>
  <text x="390" y="468" text-anchor="middle" font-size="13" fill="#065f46">IP→주체 번역(lastNetworkIp) → 재평가: rate-l4 +40 → epoch bump → 능동 무효화</text>
  <text x="390" y="490" text-anchor="middle" font-size="13" fill="#065f46">+ 에지 차단 지시(enforcement)를 ack로 반환</text>

  <text x="405" y="548" text-anchor="middle" font-size="12" fill="#64748b">커널은 판단하지 않는다 — 차단의 지속은 판단 주체(PIP)의 갱신에 의존하고, TTL이 만료되면 커널이 스스로 통과시킨다(fail-safe).</text>
</svg>
