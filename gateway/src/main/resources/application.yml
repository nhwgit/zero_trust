server:
  port: 8080   # 외부 진입점. keycloak(8081)/resource-api(8082)와 포트 분리.

spring:
  application:
    name: gateway
  # fan-out을 켤 때만 쓰는 Redis 연결(off면 미사용). 다중 GW가 같은 채널을 보도록 같은 Redis를 가리킨다.
  # 구독은 백그라운드 스레드라 요청 핫패스를 막진 않지만, 기동 시 Redis 불통이 길게 매달리지 않게 짧게 잡는다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:200ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
  cloud:
    gateway:
      routes:
        # 외부 요청은 전부 이 라우트를 타고 resource-api로 전달된다.
        # JWT 검증/신뢰헤더 주입은 라우팅과 별개인 커스텀 GlobalFilter가 담당한다.
        - id: resource-api
          uri: ${RESOURCE_API_URI:http://localhost:8082}
          predicates:
            - Path=/api/**

ztg:
  gateway:
    # 토큰 검증 기준. resource-api와 동일한 issuer여야 한다(JWKS는 .well-known에서 조회).
    issuer-uri: ${KC_ISSUER_URI:http://localhost:8081/realms/ztg}
    # 게이트웨이를 통과한 요청임을 증명하는 내부 신뢰 헤더의 공유 비밀.
    # resource-api가 동일 값을 검증해 우회 직접호출을 차단한다(데모용 정적 비밀 — mtls 프로파일에선 mTLS가 대체).
    trust-secret: ${GATEWAY_TRUST_SECRET:ztg-gateway-trust-secret}
    # PDP(정책결정) 위치. JWT 검증 통과 후 매 요청마다 여기에 인가를 질의한다.
    pdp-base-uri: ${PDP_BASE_URI:http://localhost:8084}
    # XFF 신뢰 경계: 소켓 원격주소가 이 목록(IP/CIDR, 쉼표 구분)에 들 때만 X-Forwarded-For를
    # 출발지 IP로 인정한다. XFF는 자기 신고 값이라 무조건 믿으면 위조로 ip-change 신호 회피가 가능.
    # 기본은 loopback 신뢰(데모/스모크가 localhost 경유 XFF 주입) — 운영이라면 빈 값에서 시작해
    # 실제 LB/프록시 대역만 명시한다. 컨테이너 경로는 도커 브리지 대역을 env로 추가.
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:127.0.0.0/8,::1/128}
    # hour-of-day 관측 시계의 존. 호스트 TZ 대신 설정으로 고정 — 전 서비스(PIP zone 포함)와 같은 값이어야
    # off-hours 판정·캐시 키가 노드 간 일치한다(임계 정합과 같은 배포 설정 결합).
    zone: ${GATEWAY_ZONE:Asia/Seoul}
    # 주체별 요청 레이트 관측(PEP). 슬라이딩 윈도우 길이 + 폭주 판정 임계.
    # 소유권: 단일 GW(기본)는 노드-로컬 인메모리. fanout.enabled=true(다중 GW 모드)면 Redis 공유 집계로
    # 승격된다 — 노드별로 세면 폭주가 1/N로 희석돼 어느 노드도 임계를 못 넘기 때문(임계는 전역 레이트 기준).
    # 장애 시엔 노드-로컬로 강등(fail-degraded)하며 인증/인가는 그대로 강제된다.
    rate:
      window: ${RATE_WINDOW:10s}
      # 이 수를 넘으면 "폭주" 밴드 진입. 밴드가 전이하는 순간 캐시를 강제 바이패스해 재평가를 유발한다(능동 무효화 트리거).
      # PIP의 risk.burst-threshold(점수 가중 기준)와 같은 값으로 둬, 강제 재평가가 곧 위험점수 상승으로 이어지게 한다.
      burst-threshold: ${RATE_BURST_THRESHOLD:60}
      # 히스테리시스 해제 임계: 이 수 이하로 내려와야 밴드가 정상으로 돌아온다(사이 구간은 직전 밴드 유지).
      # 진입 임계 하나면 레이트가 경계에서 진동할 때마다 전이=바이패스가 반복된다. PIP의 risk.burst-exit-threshold와 동일 값 유지.
      burst-exit-threshold: ${RATE_BURST_EXIT_THRESHOLD:40}
    # PDP decision 캐싱: 같은 요청(subject+action+resource)의 직전 결정을 짧게 재사용해 PDP 왕복을 줄인다.
    # ttl로 정책/위험 변화 반영 지연을 바운드한다(짧게). enabled=false로 끄면 같은 바이너리로 before 측정.
    decision-cache:
      enabled: ${DECISION_CACHE_ENABLED:true}
      ttl: ${DECISION_CACHE_TTL:5s}
      # 위험적응 TTL: 점수가 high-risk-score 이상인 결정은 짧게 캐싱해 더 자주 재평가한다(고위험=짧게).
      high-risk-ttl: ${DECISION_CACHE_HIGH_RISK_TTL:1s}
      high-risk-score: ${DECISION_CACHE_HIGH_RISK_SCORE:50}
      max-size: ${DECISION_CACHE_MAX_SIZE:10000}
      # 고아 회수(sweep) 스로틀: 가득 찬 put이 만료 엔트리를 전수 회수하는 최소 간격. epoch 키-아웃 고아와
      # 회전된 IP 엔트리는 재조회가 없어 lazy 제거가 안 걸리므로, sweep 없이는 IP 회전만으로 max-size를
      # 영구 점유해 캐시를 사실상 꺼버릴 수 있다(공격자 유발 DoS). 간격은 O(n) 스캔의 CPU 소모 상한이다.
      sweep-interval: ${DECISION_CACHE_SWEEP_INTERVAL:1s}
  # 다중 GW 능동 무효화 fan-out(Redis pub/sub) 구독. 기본 off — 켜면 한 노드에서 오른 epoch가
  # 모든 노드의 캐시를 동시에 키-아웃한다. off면 Redis에 연결하지 않는다(단일 GW/테스트 무영향).
  fanout:
    enabled: ${FANOUT_ENABLED:false}

# 관측: Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  health:
    redis:
      # fan-out용 Redis는 선택적 의존성(기본 off·best-effort 구독)이라, 부재가 /actuator/health를
      # 통째로 DOWN시키면 안 된다(가용성 우선 설계와 일치). fanout을 켜면 별도로 모니터링한다.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # 데모: 필요한 것만 노출(전체 * 금지)
  metrics:
    tags:
      application: ${spring.application.name}      # 모든 지표에 서비스 식별 태그 부착
    distribution:
      # PDP 호출 지연을 히스토그램으로 발행 → Prometheus histogram_quantile로 p99 계산 가능.
      percentiles-histogram:
        ztg.pdp.requests: true
      slo:
        ztg.pdp.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
