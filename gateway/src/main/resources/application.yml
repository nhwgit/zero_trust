server:
  port: 8080   # 외부 진입점. keycloak(8081)/resource-api(8082)와 포트 분리.

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # 외부 요청은 전부 이 라우트를 타고 resource-api로 전달된다.
        # JWT 검증/신뢰헤더 주입은 라우팅과 별개인 커스텀 GlobalFilter가 담당한다.
        - id: resource-api
          uri: ${RESOURCE_API_URI:http://localhost:8082}
          predicates:
            - Path=/api/**

ztg:
  gateway:
    # 토큰 검증 기준. resource-api와 동일한 issuer여야 한다(JWKS는 .well-known에서 조회).
    issuer-uri: ${KC_ISSUER_URI:http://localhost:8081/realms/ztg}
    # 게이트웨이를 통과한 요청임을 증명하는 내부 신뢰 헤더의 공유 비밀.
    # resource-api가 동일 값을 검증해 우회 직접호출을 차단한다(데모용 정적 비밀 — Phase 6에서 mTLS로 대체).
    trust-secret: ${GATEWAY_TRUST_SECRET:ztg-gateway-trust-secret}
    # PDP(정책결정) 위치. JWT 검증 통과 후 매 요청마다 여기에 인가를 질의한다.
    pdp-base-uri: ${PDP_BASE_URI:http://localhost:8084}
    # 주체별 요청 레이트 관측(PEP). 슬라이딩 윈도우 길이 + 폭주 판정 임계.
    rate:
      window: ${RATE_WINDOW:10s}
      # 이 수를 넘으면 "폭주" 밴드. 밴드를 넘나드는 순간 캐시를 강제 바이패스해 재평가를 유발한다(능동 무효화 트리거).
      # PIP의 risk.burst-threshold(점수 가중 기준)와 같은 값으로 둬, 강제 재평가가 곧 위험점수 상승으로 이어지게 한다.
      burst-threshold: ${RATE_BURST_THRESHOLD:60}
    # PDP decision 캐싱: 같은 요청(subject+action+resource)의 직전 결정을 짧게 재사용해 PDP 왕복을 줄인다.
    # ttl로 정책/위험 변화 반영 지연을 바운드한다(짧게). enabled=false로 끄면 같은 바이너리로 before 측정.
    decision-cache:
      enabled: ${DECISION_CACHE_ENABLED:true}
      ttl: ${DECISION_CACHE_TTL:5s}
      # 위험적응 TTL: 점수가 high-risk-score 이상인 결정은 짧게 캐싱해 더 자주 재평가한다(고위험=짧게).
      high-risk-ttl: ${DECISION_CACHE_HIGH_RISK_TTL:1s}
      high-risk-score: ${DECISION_CACHE_HIGH_RISK_SCORE:50}
      max-size: ${DECISION_CACHE_MAX_SIZE:10000}

# 관측(Phase 4): Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # 데모: 필요한 것만 노출(전체 * 금지)
  metrics:
    tags:
      application: ${spring.application.name}      # 모든 지표에 서비스 식별 태그 부착
    distribution:
      # PDP 호출 지연을 히스토그램으로 발행 → Prometheus histogram_quantile로 p99 계산 가능.
      percentiles-histogram:
        ztg.pdp.requests: true
      slo:
        ztg.pdp.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
