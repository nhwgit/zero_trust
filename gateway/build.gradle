// gateway — DP/PEP. 모든 외부 트래픽이 통과하는 정책 시행 지점.
// Spring Cloud Gateway(리액티브/WebFlux) 위에 커스텀 GlobalFilter로 JWT를 검증한다.
plugins {
    id 'org.springframework.boot'
}

// Spring Cloud BOM — Boot 3.3.x 호환 릴리스 트레인(2023.0.x).
ext {
    springCloudVersion = '2023.0.3'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // 리액티브 게이트웨이(라우팅 + GlobalFilter)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    // JWT(Bearer) 검증용 ReactiveJwtDecoder. resource-server 스타터지만
    // 여기서는 자동 필터체인을 쓰지 않고 디코더만 꺼내 커스텀 필터에서 검증한다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}
