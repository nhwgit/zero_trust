server:
  port: 8083   # gateway(8080)/keycloak(8081)/resource-api(8082)와 포트 분리. PDP만 호출하는 내부 서비스.

spring:
  application:
    name: pip

# 분산 추적(Phase 4 Step 3): 모든 로그 라인에 요청 추적 ID([requestId])를 찍는다.
# RequestIdFilter가 PDP에서 전파된 X-Request-Id를 MDC에 채운다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# 관측(Phase 4): Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
