server:
  port: 8083   # gateway(8080)/keycloak(8081)/resource-api(8082)와 포트 분리. PDP만 호출하는 내부 서비스.

spring:
  application:
    name: pip
  # fan-out을 켤 때만 쓰는 Redis 연결(off면 미사용 — no-op 발신점만 활성).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # publish는 위험 평가(assess) 경로에서 동기로 일어난다. Lettuce 기본 커맨드 타임아웃(~60s)이면 Redis가
      # 행(hang)일 때 평가가 그만큼 블록된다 — fail-open 의도와 어긋난다. 짧게 잡아 bump 경로 꼬리 지연을 바운드:
      # 타임아웃 시 예외 → publisher가 삼키고 진행하며, 무효화는 게이트웨이 TTL·lazy 학습 백스톱이 책임진다.
      timeout: ${REDIS_TIMEOUT:200ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}

ztg:
  pip:
    # out-of-band(L4 재평가) 시계의 존. 게이트웨이 zone과 같은 값이어야 시각 판정 좌표가 일치한다
    # (임계 정합과 같은 배포 설정 결합).
    zone: ${PIP_ZONE:Asia/Seoul}
    # 에지 차단 제외 대역(IP/CIDR) — LB/프록시 뒤 배치에선 커널이 보는 소스가 경유 사용자 전원의
    # 공유 IP(LB)라, 그 IP에 deny를 내리면 전원이 L4에서 끊긴다. 목록에 든 IP의 신호는 세션 축
    # 재평가만 하고 enforcement를 생략한다. 기본 빈 값(직결 배치는 제외 불필요) — LB 배치 시
    # 대역을 명시한다(게이트웨이 trusted-proxies와 같은 부류의 배포 설정 결합).
    edge-block-exempt: ${PIP_EDGE_BLOCK_EXEMPT:}
  # 다중 GW 능동 무효화 fan-out(Redis pub/sub) 발신. 기본 off — 켜면 epoch 상승을 모든 GW에 즉시 전파한다.
  # off면 Redis에 연결하지 않는다(단일 PIP/테스트 무영향).
  fanout:
    enabled: ${FANOUT_ENABLED:false}

# 분산 추적: 모든 로그 라인에 요청 추적 ID([requestId])를 찍는다.
# RequestIdFilter가 PDP에서 전파된 X-Request-Id를 MDC에 채운다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# 관측: Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  health:
    redis:
      # fan-out용 Redis는 선택적 의존성(기본 off·best-effort 발신)이라, 부재가 /actuator/health를
      # 통째로 DOWN시키면 안 된다(가용성 우선 설계와 일치). fanout을 켜면 별도로 모니터링한다.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
