server:
  port: 8083   # gateway(8080)/keycloak(8081)/resource-api(8082)와 포트 분리. PDP만 호출하는 내부 서비스.

spring:
  application:
    name: pip

# 관측(Phase 4): Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
