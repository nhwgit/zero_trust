server:
  port: 8084   # gateway(8080)/keycloak(8081)/resource-api(8082)/pip(8083)와 포트 분리.

spring:
  application:
    name: pdp

# 분산 추적(Phase 4 Step 3): 모든 로그 라인에 요청 추적 ID([requestId])를 찍어
# 게이트웨이→PDP→PIP를 같은 ID로 상관한다. RequestIdFilter가 MDC에 값을 채운다.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

ztg:
  pdp:
    # PIP(맥락 제공) 위치. PDP는 판단 시 여기서 주체 속성을 조회한다.
    pip-base-uri: ${PIP_BASE_URI:http://localhost:8083}
    # payroll 업무시간 창(시작 포함, 끝 제외). 데모에서 조건을 바꿔 결과를 뒤집을 수 있도록 설정으로 노출.
    business-hour-start: ${BUSINESS_HOUR_START:9}
    business-hour-end: ${BUSINESS_HOUR_END:18}
    # 위험점수 임계치(이상이면 차단). 위험적응 인가 데모용.
    risk-threshold: ${RISK_THRESHOLD:80}
    # PIP 호출 RestClient의 커넥션 풀(keep-alive). 미적용 시 고부하에서 임시 포트 고갈→fail-close 폭증.
    # max-per-route 기본 5는 동시 부하 대비 과소 → 상향. 자세한 이유는 HttpClientConfig 참조.
    pip-pool:
      max-total: ${PIP_POOL_MAX_TOTAL:200}
      max-per-route: ${PIP_POOL_MAX_PER_ROUTE:200}
      connect-timeout-ms: ${PIP_POOL_CONNECT_TIMEOUT_MS:2000}
      socket-timeout-ms: ${PIP_POOL_SOCKET_TIMEOUT_MS:5000}

# 관측(Phase 4): Prometheus가 /actuator/prometheus를 스크랩한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
