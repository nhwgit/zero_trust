// pdp — Policy Decision Point. 정책의 두뇌: 요청을 받아 PIP에서 맥락을 모아 ALLOW/DENY를 판단한다.
// 1차는 Java 정책엔진으로 구현(추후 OPA/Rego 교체 검토).
plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // PDP→PIP 호출용 RestClient의 풀드 커넥션 매니저(keep-alive). 미적용 시 요청마다 새 TCP 연결을
    // 열어 고부하에서 임시 포트가 고갈되고("Address already in use") PIP 조회가 실패→fail-close 폭증.
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation project(':common')   // Decision* / SubjectAttributes 공유 DTO
    // 관측: actuator로 /actuator/prometheus 노출, micrometer로 PDP 판단 지표 수집
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
