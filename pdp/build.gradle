// pdp — Policy Decision Point. 정책의 두뇌: 요청을 받아 PIP에서 맥락을 모아 ALLOW/DENY를 판단한다.
// 1차는 Java 정책엔진으로 구현(roadmap 후반에 OPA/Rego로 교체 검토).
plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':common')   // Decision* / SubjectAttributes 공유 DTO
    // 관측: actuator로 /actuator/prometheus 노출, micrometer로 PDP 판단 지표 수집
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
