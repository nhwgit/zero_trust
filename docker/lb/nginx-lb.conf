# L4 LB(nginx stream) — 에지 관측 토폴로지: 클라이언트 → 이 LB(:18080) → gateway(:8080).
# proxy_protocol on: 원 클라이언트 좌표를 PP 헤더로 GW에 넘긴다(GW는 GATEWAY_PROXY_PROTOCOL_*로 수신).
# XDP 관측 지점은 이 컨테이너의 veth(진짜 에지) — 커널이 클라이언트 IP 단위로 SYN을 본다.
events {}
stream {
    server {
        listen 18080;
        proxy_pass gateway:8080;
        proxy_protocol on;
    }
}
