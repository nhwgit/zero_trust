# Grafana 데이터소스 자동 프로비저닝
# grafana 컨테이너에서 prometheus 컨테이너는 compose 기본 네트워크의 서비스명으로 접근한다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus          # 대시보드 JSON이 이 uid로 패널 데이터소스를 참조
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
