# D2 패킷관측 전용 override — pdp/pip 데이터 포트의 mTLS를 TLS 1.2로 강제한다.
#
# 왜: TLS 1.3은 ServerHello 이후 핸드셰이크(Certificate·CertificateRequest·CertificateVerify)를
# 전부 핸드셰이크 트래픽 키로 암호화한다 → 와이어에서 type 13(CertificateRequest)이 안 보인다.
# TLS 1.2는 이 메시지들이 평문이라 Wireshark에서 server CN=pdp / client CN=gateway / type 13을
# 눈으로 본다("mTLS를 와이어로 입증" = D2의 결정적 한 컷).
#
# ⚠️ 핵심 함정: SSL 번들(server.ssl.bundle)을 쓰면 server.ssl.enabled-protocols 가 무시된다.
# 반드시 번들 옵션 spring.ssl.bundle.jks.<name>.options.enabled-protocols 로 설정해야 한다.
# 하이픈 키(ztg-pdp)는 env 상대바인딩이 까다로워 SPRING_APPLICATION_JSON 으로 주입한다.
#
# pdp의 ztg-pdp 번들은 8084(서버) + pdp→pip(클라, pip-ssl-bundle=ztg-pdp) 양쪽에 쓰이므로
# 이것만 1.2로 제한해도 캡처 대상(8084 inbound, 8083 outbound)이 둘 다 1.2가 된다.
# pip(ztg-pip)도 같이 박아 서버 측도 1.2만 제공하게 한다(이중 안전).
#
# 사용(1.2 캡처 재기동):
#   docker compose -f docker-compose.yml -f compose-apps.yml -f compose-tls12.yml up -d pdp pip
# 1.3으로 되돌리기:
#   docker compose -f docker-compose.yml -f compose-apps.yml up -d pdp pip   # override 빼고 재생성
#
# ⚠️ 데모/관측용 다운그레이드일 뿐 운영 권장 아님 — 평소 스택은 1.3 그대로다.
services:
  pdp:
    environment:
      SPRING_APPLICATION_JSON: '{"spring.ssl.bundle.jks.ztg-pdp.options.enabled-protocols":["TLSv1.2"]}'

  pip:
    environment:
      SPRING_APPLICATION_JSON: '{"spring.ssl.bundle.jks.ztg-pip.options.enabled-protocols":["TLSv1.2"]}'
